<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <nav id="navbar">
      <button id="toggle-sidebar" title="Toggle sidebar">
        <i class="bi bi-layout-sidebar"></i>
      </button>

      <div class="brand">NoteFlow</div>

      <div class="nav-tabs-custom">
        <button class="nav-tab-btn active" data-section="tasks">
          <i class="bi bi-check2-square"></i>
          <span>Tasks</span>
          <span class="tab-count" id="cnt-tasks">0</span>
        </button>

        <button class="nav-tab-btn" data-section="archive">
          <i class="bi bi-archive"></i>
          <span>Archive</span>
          <span class="tab-count" id="cnt-archive">0</span>
        </button>

        <button class="nav-tab-btn" data-section="bin">
          <i class="bi bi-trash3"></i>
          <span>Bin</span>
          <span class="tab-count" id="cnt-bin">0</span>
        </button>
      </div>

      <div id="select-actions">
        <span class="sel-count"> <span id="sel-num">0</span> selected </span>

        <button class="action-btn" id="sel-archive-btn">
          <i class="bi bi-archive"></i> Archive
        </button>

        <button class="action-btn danger" id="sel-delete-btn">
          <i class="bi bi-trash3"></i> Delete
        </button>

        <button class="action-btn" id="sel-cancel-btn">
          <i class="bi bi-x"></i> Cancel
        </button>
      </div>

      <button id="theme-toggle" title="Toggle Theme">
        <i class="bi bi-sun-fill"></i>
      </button>
    </nav>

    <aside id="sidebar">
      <div class="sidebar-label">Views</div>

      <button class="sidebar-btn active" data-section="tasks">
        <i class="bi bi-check2-square"></i>
        Tasks
        <span class="sb-count" id="sb-cnt-tasks">0</span>
      </button>

      <button class="sidebar-btn" data-section="archive">
        <i class="bi bi-archive"></i>
        Archive
        <span class="sb-count" id="sb-cnt-archive">0</span>
      </button>

      <button class="sidebar-btn" data-section="bin">
        <i class="bi bi-trash3"></i>
        Bin
        <span class="sb-count" id="sb-cnt-bin">0</span>
      </button>
    </aside>

    <main id="main">
      <section id="section-tasks" class="section active">
        <div class="section-title">
          <i class="bi bi-check2-square"></i>
          My Tasks
        </div>

        <div id="add-task-bar">
          <i class="bi bi-plus-circle add-icon"></i>

          <input
            type="text"
            id="task-input"
            placeholder="Add a new task....."
          />

          <button id="add-btn">
            <i class="bi bi-plus-lg"></i>
            Add
          </button>
        </div>

        <div id="pinned-section">
          <div class="tasks-row-label">
            <i class="bi bi-pin-fill"></i>
            Pinned
          </div>

          <div class="tasks-grid" id="pinned-grid"></div>
        </div>

        <div id="all-tasks-section">
          <div class="tasks-row-label" id="others-label">Tasks</div>

          <div class="tasks-grid" id="tasks-grid"></div>

          <div id="tasks-empty" class="empty-state">
            <i class="bi bi-journal-check"></i>
            <p>No tasks yet. Add one above!</p>
          </div>
        </div>
      </section>

      <section id="section-archive" class="section">
        <div class="section-title">
          <i class="bi bi-archive"></i>
          Archive
        </div>

        <div class="tasks-grid" id="archive-grid"></div>

        <div id="archive-empty" class="empty-state">
          <i class="bi bi-archive"></i>
          <p>No archived tasks.</p>
        </div>
      </section>

      <section id="section-bin" class="section">
        <div class="section-title">
          <i class="bi bi-trash3"></i>
          Bin
        </div>

        <div class="tasks-grid" id="bin-grid"></div>

        <div id="bin-empty" class="empty-state">
          <i class="bi bi-trash3"></i>
          <p>Bin is empty.</p>
        </div>
      </section>
    </main>

    <div id="expand-overlay"></div>

    <div id="expand-card">
      <button id="popup-close-icon">
        <i class="bi bi-x-lg"></i>
      </button>

      <div class="expand-content">
        <div id="expand-task-text"></div>
      </div>

      <div class="expand-footer popup-actions">
        <button id="close-expand">Close</button>
        <button id="update-task-btn">Update</button>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
